<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Ukončení provozu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .language-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .lang-button {
      background-color: rgb(0, 153, 0);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      margin-left: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s ease-in-out;
    }

    .lang-button:hover {
      transform: scale(1.1);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      height: 100%;
      padding-top: 120px;
      text-align: center;
    }

    h1 {
      font-weight: bold;
      font-size: 24px;
      margin-bottom: 30px;
    }

    .download-button {
      background-color: rgb(0, 153, 0);
      color: white;
      font-weight: bold;
      padding: 15px 30px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease-in-out;
    }

    .download-button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="language-switcher">
    <button class="lang-button" onclick="setLanguage('cz')">CZ</button>
    <button class="lang-button" onclick="setLanguage('en')">EN</button>
  </div>

  <div class="container">
    <h1 id="main-title">UvíkOS už nepotřebuje Javu</h1>
    <a href="https://admin-iget.github.io/test/uvikos.html" class="download-button" id="download-text">Přejít na UvíkOS web</a>
  </div>

  <script>
    function setLanguage(lang) {
      if (lang === 'cz') {
        document.getElementById('main-title').textContent = 'Ukončení provozu';
        document.getElementById('download-text').textContent = 'Přejít na UvíkOS web';
      } else if (lang === 'en') {
        document.getElementById('main-title').textContent = 'Web is down';
        document.getElementById('download-text').textContent = 'Open UvikOS web';
      }
    }
  </script>
</body>
</html>
